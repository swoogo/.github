---
name: 'Set Commit Status'
description: 'Set GitHub commit status for branch protection checks'

inputs:
  sha:
    description: 'Commit SHA to set status on'
    required: true
  state:
    description: 'Status state (pending, success, failure, error)'
    required: true
  context:
    description: 'Status check context name'
    required: true
  description:
    description: 'Status description'
    required: true
  target-url:
    description: 'URL for the status details link'
    required: false
  token:
    description: 'GitHub token (app token for bot identity, or default GITHUB_TOKEN)'
    required: false
    default: ''

outputs:
  status-url:
    description: 'URL of the created status'
    value: ${{ steps.set-status.outputs.status-url }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        # Validate state
        STATE="${{ inputs.state }}"
        if [[ ! "$STATE" =~ ^(pending|success|failure|error)$ ]]; then
          echo "❌ Invalid state: $STATE (must be pending, success, failure, or error)"
          exit 1
        fi

        # Validate SHA format
        SHA="${{ inputs.sha }}"
        if [[ ! "$SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
          echo "❌ Invalid SHA format: $SHA"
          exit 1
        fi

        echo "✅ Inputs validated: state=$STATE, sha=${SHA:0:7}"

    - name: Set commit status
      id: set-status
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token || github.token }}
        script: |
          const sha = '${{ inputs.sha }}';
          const state = '${{ inputs.state }}';
          const statusContext = '${{ inputs.context }}';
          const description = '${{ inputs.description }}';
          const targetUrl = '${{ inputs.target-url }}' || `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

          try {
            const response = await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: statusContext,
              description: description,
              target_url: targetUrl
            });

            const statusEmoji = state === 'success' ? '✅' :
                              state === 'failure' ? '❌' :
                              state === 'error' ? '🔴' :
                              '⏳';

            console.log(`${statusEmoji} Commit status set: ${state}`);
            console.log(`   Context: ${statusContext}`);
            console.log(`   Description: ${description}`);
            console.log(`   Target URL: ${targetUrl}`);

            if (response.data && response.data.url) {
              core.setOutput('status-url', response.data.url);
            }

          } catch (error) {
            if (error.status === 404) {
              console.log(`❌ Repository or commit not found`);
              console.log(`   SHA: ${sha}`);
              core.setFailed(`Commit not found: ${error.message}`);
            } else if (error.status === 403) {
              console.log(`❌ Permission denied to set commit status`);
              console.log(`   Check that the GitHub token has write access to statuses`);
              core.setFailed(`Permission denied: ${error.message}`);
            } else {
              console.log(`❌ Failed to set commit status: ${error.message}`);
              core.setFailed(`Failed to set commit status: ${error.message}`);
            }
          }
